kind = "web"
previewPath = "/"
title = "CodeSafe"
description = "One-page landing site for CodeSafe, a Chrome extension that shows verification codes from the user's Gmail in an Apple-style pill above code inputs so they can paste with one tap. White, premium Apple-style design. Also hosts the downloadable extension zip and a privacy policy page."
version = "1.0.0"
id = "artifacts/codetap-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24797

[services.development]
run = "pnpm --filter @workspace/codetap-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/codetap-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/codetap-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24797"
BASE_PATH = "/"
