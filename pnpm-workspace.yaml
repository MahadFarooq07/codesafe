packages:
  - web
  - video
  - extension

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@types/node': ^22.18.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5

# Supply-chain hardening: refuse package versions published less than a day
# ago (most malicious releases are caught and pulled within hours).
minimumReleaseAge: 1440

# Only these packages may run install scripts.
onlyBuiltDependencies:
  - esbuild
  - '@tailwindcss/oxide'
